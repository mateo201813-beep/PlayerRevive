name: Compilar plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar con Maven
        run: mvn -B -ntp package

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: AmarradosRevive
          path: target/AmarradosRevive-*.jar

      - name: Publicar en Releases (ultima version)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-${{ github.ref_name == 'main' && 'main' || 'dev' }}
          name: AmarradosRevive (${{ github.ref_name }})
          prerelease: ${{ github.ref_name != 'main' }}
          files: target/AmarradosRevive-*.jar
